services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barber_core_api}
      POSTGRES_USER: ${POSTGRES_USER:-barber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barber}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: .
      target: runtime
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-barber}:${POSTGRES_PASSWORD:-barber}@postgres:5432/${POSTGRES_DB:-barber_core_api}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
    command: ['node', 'dist/src/cli/migrate.js']

  api:
    build:
      context: .
      target: runtime
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-barber}:${POSTGRES_PASSWORD:-barber}@postgres:5432/${POSTGRES_DB:-barber_core_api}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://host.docker.internal:18080/realms/barber}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://host.docker.internal:18080/realms/barber/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-barber-core-api}
      OIDC_CLOCK_TOLERANCE_SECONDS: ${OIDC_CLOCK_TOLERANCE_SECONDS:-5}
      OIDC_JWKS_TIMEOUT_MS: ${OIDC_JWKS_TIMEOUT_MS:-3000}
    ports:
      - '${API_PORT:-3000}:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then((res)=>{if(!res.ok) process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres_data:
